# GitLab Pages Configuration for IMPULSPACE Website
image: alpine:latest

pages:
  stage: deploy
  script:
    - mkdir public
    - cp -r * public/
    - cp -r .nojekyll .gitlab-ci.yml CNAME public/ 2>/dev/null || true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
